name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    # ubuntu-latest is 26.04, which setup-python has no 3.9 build for; 24.04 still has every version
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e '.[test,data]'
      - run: pytest -q

  core-only:
    # convergence must run with no third-party packages; fill-gap tests skip
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: pip install -e '.[test]'
      - run: pytest -q

  min-deps:
    # the lowest numpy/pandas the data extra allows; 24.04 for Python 3.9 (see test)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.9"
      - run: pip install -e '.[test]' 'numpy==1.23.5' 'pandas==1.5.3'
      - run: pytest -q

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: pip install build twine
      - run: python -m build
      - run: twine check --strict dist/*
      - name: Wheel installs clean and runs
        run: |
          python -m venv /tmp/wheel && /tmp/wheel/bin/pip install dist/*.whl
          /tmp/wheel/bin/bt2live --version
          /tmp/wheel/bin/bt2live convergence examples/results_converged.csv --json > /dev/null
