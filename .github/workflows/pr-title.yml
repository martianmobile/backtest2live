name: PR title

# The squash-merge commit takes the PR title, and semantic-release reads it:
# feat -> minor, fix -> patch. No "!" or BREAKING CHANGE before 1.0.
on:
  pull_request_target:
    types: [opened, edited, synchronize, reopened]

permissions:
  pull-requests: read

jobs:
  conventional:
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            perf
            docs
            test
            ci
            build
            refactor
            chore
            revert
      - name: No breaking-change marker before 1.0
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          if printf '%s' "$TITLE" | grep -Eq '^[a-z]+(\([^)]*\))?!:'; then
            echo "::error::'!' would release 1.0.0. Before 1.0, describe the break in the body under a feat: title."
            exit 1
          fi
