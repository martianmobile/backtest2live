name: Release

# Closing a milestone ships it. Commits decide the version (feat -> minor,
# fix -> patch); the milestone title must match, or nothing is tagged.
on:
  milestone:
    types: [closed]
  workflow_dispatch:
    inputs:
      version:
        description: "Version this release must compute, as the milestone title (e.g. v0.2)"
        required: true

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    outputs:
      published: ${{ steps.semantic.outputs.new_release_published }}
      version: ${{ steps.semantic.outputs.new_release_version }}
    steps:
      - name: Generate app token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.RELEASE_BOT_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_BOT_PRIVATE_KEY }}
          # no owner/repositories: the token covers this repository only

      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true
          token: ${{ steps.app-token.outputs.token }}

      - name: Configure git author
        run: |
          git config user.name  "martian-mobile-release-bot[bot]"
          git config user.email "284492098+martian-mobile-release-bot[bot]@users.noreply.github.com"

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: pip install build

      - name: Semantic Release
        id: semantic
        uses: cycjimmy/semantic-release-action@b12c8f6015dc215fe37bc154d4ad456dd3833c90  # v6.0.0, pinned: runs with the write token
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          EXPECTED_VERSION: ${{ github.event.milestone.title || inputs.version }}
        with:
          semantic_version: 25.0.9
          extra_plugins: |
            @semantic-release/git@11
            @semantic-release/changelog@7
            @semantic-release/exec@7

      # A closed milestone that ships nothing is a stranded release, not a no-op.
      - name: Fail when nothing was released
        if: steps.semantic.outputs.new_release_published != 'true'
        run: |
          echo "::error::No release: no feat/fix commits since the last tag, or the version check failed above."
          exit 1

      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  pypi:
    needs: release
    if: needs.release.outputs.published == 'true'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/backtest2live/${{ needs.release.outputs.version }}/
    permissions:
      id-token: write  # trusted publishing: no token stored
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
